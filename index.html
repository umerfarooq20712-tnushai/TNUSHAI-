<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <title>CLASSIFIED — WHO IS MONTAGEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary-color: #ff1a1a;
      --primary-glow: rgba(255, 0, 0, .8);
      --border-color: rgba(255, 0, 0, .7);
      --bg-gradient: linear-gradient(135deg, #ff0000, #990000);
      --box-bg: rgba(10, 10, 10, .85);
      --shadow-color: rgba(255, 0, 0, .45);
    }
    html { min-height: 100%; background: #0b0b0b; }
    body {
      min-height: 100vh; min-height: 100dvh; background: #0b0b0b; color: #fff;
      font-family: "Share Tech Mono", monospace; display: flex; flex-direction: column;
      align-items: center; justify-content: center; overflow: hidden;
    }
    button { -webkit-tap-highlight-color: transparent; }
    .menu-btn {
      position: fixed; top: 16px; left: 16px; background: rgba(15,15,15,.96);
      border: 2px solid var(--primary-color); color: #fff; width: 48px; height: 48px;
      border-radius: 10px; display: flex; flex-direction: column; justify-content: center;
      align-items: center; gap: 5px; cursor: pointer; z-index: 100002;
      box-shadow: 0 0 15px var(--shadow-color);
      transition: border-color .3s, box-shadow .3s;
    }
    .menu-btn span { width: 24px; height: 3px; display: block; background: var(--primary-color); border-radius: 2px; transition: background .3s; }
    .menu-drawer {
      position: fixed; inset: 0 auto 0 0; width: min(280px, 84vw); height: 100%; height: 100dvh;
      transform: translateX(-105%); background: rgba(10,10,10,.98);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-right: 2px solid var(--primary-color); z-index: 100001;
      transition: transform .28s ease, border-color .3s; padding: 82px 18px 20px;
      box-shadow: 10px 0 30px rgba(0,0,0,.75);
    }
    .menu-drawer.open { transform: translateX(0); }
    .menu-title { font-family: Orbitron, sans-serif; font-size: 1.05rem; color: var(--primary-color); margin-bottom: 20px; letter-spacing: 1px; text-shadow: 0 0 10px var(--primary-glow); }
    .theme-buttons-container { display: flex; flex-direction: column; gap: 12px; }
    .theme-option-btn {
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.18); color: #ddd;
      padding: 14px 12px; font: 600 .84rem Orbitron, sans-serif; text-align: left; cursor: pointer;
      border-radius: 8px; display: flex; align-items: center; gap: 10px; width: 100%;
      transition: background .2s, color .2s, border-color .2s, box-shadow .2s;
    }
    .theme-option-btn.active { background: var(--primary-color); color: #050505; border-color: #fff; box-shadow: 0 0 15px var(--primary-glow); }
    
    /* STEP 1: INITIAL OVERLAY */
    #intro-overlay {
      position: fixed; inset: 0; background: #000 url("back ground.png") no-repeat center center;
      background-size: cover; display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 1000; padding: 20px; isolation: isolate;
    }
    #intro-overlay::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.42); z-index: -1; }
    #particleCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .intro-box {
      position: relative; z-index: 2; background: var(--box-bg); -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px); border: 2px solid var(--border-color); border-radius: 16px;
      padding: 36px 24px; text-align: center; width: min(380px, 94vw);
      box-shadow: 0 0 35px var(--shadow-color), inset 0 0 20px rgba(255,255,255,.05);
      transition: border-color .3s, box-shadow .3s;
    }
    .intro-title { font: 900 clamp(1.55rem, 7vw, 2.2rem)/1.2 Orbitron, sans-serif; letter-spacing: 1px; color: var(--primary-color); margin-bottom: 12px; text-transform: uppercase; text-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--primary-glow); }
    .hint-text { font-size: 1.05rem; color: #ddd; margin-bottom: 28px; letter-spacing: 2px; text-transform: lowercase; text-shadow: 0 0 5px rgba(255,255,255,.5); }
    .unlock-btn { background: var(--bg-gradient); border: 2px solid var(--primary-color); color: #fff; padding: 16px 20px; font: 700 1.05rem Orbitron, sans-serif; letter-spacing: 1.5px; cursor: pointer; border-radius: 10px; width: 100%; box-shadow: 0 0 20px var(--shadow-color); animation: pulse-glow 2s infinite alternate; }
    @keyframes pulse-glow { from { box-shadow: 0 0 15px var(--shadow-color); } to { box-shadow: 0 0 35px var(--primary-glow); } }

    /* STEP 2: INTRO VIDEO CONTAINER */
    #intro-video-container { display: none; position: fixed; inset: 0; background: #000; z-index: 50000; justify-content: center; align-items: center; }
    #introVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }

    /* STEP 3: INNER DASHBOARD */
    #main-content {
      display: none; position: fixed; inset: 0; 
      background: #000 url("Incognito.jpg") no-repeat center center;
      background-size: contain; background-color: #0b0b0b;
      text-align: center; padding: 24px 20px; width: 100%; height: 100%;
      flex-direction: column; align-items: center; justify-content: center; z-index: 2;
    }
    .dashboard-box {
      background: var(--box-bg); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border: 2px solid var(--border-color); border-radius: 16px; padding: 35px 25px;
      max-width: 380px; width: 90%; box-shadow: 0 0 35px var(--shadow-color);
    }
    h1 { font: 700 clamp(1.3rem, 4.5vw, 1.6rem) Orbitron, sans-serif; letter-spacing: 1px; margin-bottom: 22px; color: var(--primary-color); text-transform: uppercase; text-shadow: 0 0 15px var(--primary-glow); }
    .start-animation-btn { background: var(--bg-gradient); border: 2px solid var(--primary-color); color: #fff; padding: 15px 24px; font: 700 1rem Orbitron, sans-serif; cursor: pointer; border-radius: 10px; width: 100%; box-shadow: 0 0 20px var(--shadow-color); transition: 0.3s; }
    .start-animation-btn:hover { transform: scale(1.03); box-shadow: 0 0 30px var(--primary-glow); }

    /* STEP 4: FUTURE ANIMATION CONTAINER */
    #animation-container { display: none; position: fixed; inset: 0; background: #000; z-index: 60000; justify-content: center; align-items: center; }
    #actionVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .video-skip { position: absolute; right: 20px; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 2; padding: 10px 18px; background: rgba(0,0,0,0.8); border: 1px solid var(--primary-color); color: white; border-radius: 8px; font: 700 0.85rem Orbitron, sans-serif; cursor: pointer; }

    /* STEP 5: PROTOTYPE WELCOME MENU & TERMINAL */
    #prototype-menu {
      display: none; position: fixed; inset: 0; background: #070707; z-index: 70000;
      flex-direction: column; align-items: center; justify-content: flex-start; padding: 30px 20px; overflow-y: auto;
    }
    .terminal-card {
      background: rgba(12, 12, 12, 0.92); border: 2px solid var(--primary-color); border-radius: 12px;
      width: 100%; max-width: 600px; padding: 25px; box-shadow: 0 0 30px var(--shadow-color);
      margin-top: 50px; text-align: left;
    }
    .terminal-header { font-family: 'Orbitron', sans-serif; color: var(--primary-color); font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    .terminal-body { font-size: 0.9rem; color: #00ff66; line-height: 1.5; min-height: 120px; }
    .terminal-input-row { display: flex; gap: 10px; margin-top: 15px; }
    .terminal-input { background: #000; border: 1px solid var(--primary-color); color: #fff; padding: 10px; font-family: 'Share Tech Mono', monospace; flex: 1; border-radius: 6px; }
    .terminal-send { background: var(--primary-color); color: #000; border: none; padding: 10px 18px; font-weight: bold; cursor: pointer; border-radius: 6px; font-family: 'Orbitron', sans-serif; }

    @media (max-width: 420px) { .intro-box, .dashboard-box, .terminal-card { padding: 25px 15px; } }
  </style>
</head>
<body>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Open theme menu" aria-controls="menuDrawer" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <aside class="menu-drawer" id="menuDrawer" aria-label="Theme selection">
    <div class="menu-title">Select Vibe</div>
    <div class="theme-buttons-container">
      <button class="theme-option-btn active" id="btn-fire" data-theme="fire" type="button" aria-pressed="true">🔥 Red Fire</button>
      <button class="theme-option-btn" id="btn-petals" data-theme="petals" type="button" aria-pressed="false">🌹 Rose Petals</button>
      <button class="theme-option-btn" id="btn-snow" data-theme="snow" type="button" aria-pressed="false">❄️ Snow Ice</button>
      <button class="theme-option-btn" id="btn-crystal" data-theme="crystal" type="button" aria-pressed="false">💎 Crystal Ice</button>
    </div>
  </aside>

  <!-- STEP 1: INITIAL OVERLAY -->
  <section id="intro-overlay" aria-label="Welcome screen">
    <canvas id="particleCanvas" aria-hidden="true"></canvas>
    <div class="intro-box">
      <div class="intro-title">WHO IS MONTAGEM</div>
      <div class="hint-text">you can't find me</div>
      <button class="unlock-btn" id="enterBtn" type="button">Tap to Enter</button>
    </div>
  </section>

  <!-- STEP 2: INTRO VIDEO CONTAINER -->
  <section id="intro-video-container" aria-label="Intro video">
    <video id="introVideo" playsinline preload="auto">
      <source src="Intro.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </section>

  <audio id="introSongAudio" preload="auto">
    <source src="Intro song.mp3" type="audio/mpeg">
  </audio>

  <!-- STEP 3: INNER DASHBOARD -->
  <main id="main-content">
    <div class="dashboard-box">
      <h1>Command Center</h1>
      <button class="start-animation-btn" id="startAnimBtn" type="button">▶ Let's Start</button>
    </div>

    <!-- Background Phonk Music -->
    <audio id="phonkAudio" loop preload="auto">
      <source src="your-phonk-track.mp3" type="audio/mpeg">
    </audio>
  </main>

  <!-- STEP 4: FUTURE ANIMATION CONTAINER -->
  <section id="animation-container" aria-label="Future animation">
    <video id="actionVideo" playsinline preload="auto">
      <source src="Future animation.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <button class="video-skip" id="actionSkipBtn" type="button">Skip ↗</button>
  </section>

  <!-- STEP 5: PROTOTYPE WELCOME MENU & TERMINAL -->
  <section id="prototype-menu" aria-label="Welcome Menu">
    <div class="terminal-card">
      <div class="terminal-header">&gt;&gt; SYSTEM_ONLINE // TERMINAL_ACTIVE</div>
      <div class="terminal-body" id="terminalOutput">
        [SYS] Authentication complete.<br>
        [SYS] Welcome to the core dashboard, Architect.<br>
        Type 'help' or click commands below to explore.
      </div>
      <div class="terminal-input-row">
        <input type="text" id="terminalInput" class="terminal-input" placeholder="enter command..." />
        <button type="button" class="terminal-send" id="terminalSend">EXEC</button>
      </div>
    </div>
  </section>

  <script>
    "use strict";

    const root = document.documentElement;
    const menuBtn = document.getElementById("menuBtn");
    const menuDrawer = document.getElementById("menuDrawer");
    const introOverlay = document.getElementById("intro-overlay");
    const introVideoContainer = document.getElementById("intro-video-container");
    const introVideo = document.getElementById("introVideo");
    const introSongAudio = document.getElementById("introSongAudio");
    const mainContent = document.getElementById("main-content");
    const phonkAudio = document.getElementById("phonkAudio");
    const animationContainer = document.getElementById("animation-container");
    const actionVideo = document.getElementById("actionVideo");
    const actionSkipBtn = document.getElementById("actionSkipBtn");
    const prototypeMenu = document.getElementById("prototype-menu");
    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");

    const themes = {
      fire: {
        primary: "#ff1a1a", glow: "rgba(255,0,0,.8)", border: "rgba(255,0,0,.7)",
        gradient: "linear-gradient(135deg,#ff0000,#990000)", shadow: "rgba(255,0,0,.45)"
      },
      petals: {
        primary: "#ff3366", glow: "rgba(255,51,102,.8)", border: "rgba(255,51,102,.7)",
        gradient: "linear-gradient(135deg,#ff3366,#990033)", shadow: "rgba(255,51,102,.45)"
      },
      snow: {
        primary: "#00bfff", glow: "rgba(0,191,255,.8)", border: "rgba(0,191,255,.7)",
        gradient: "linear-gradient(135deg,#00bfff,#0044cc)", shadow: "rgba(0,191,255,.45)"
      },
      crystal: {
        primary: "#00ffff", glow: "rgba(0,255,255,.85)", border: "rgba(0,255,255,.8)",
        gradient: "linear-gradient(135deg,#00ffff,#0088aa)", shadow: "rgba(0,255,255,.5)"
      }
    };

    let currentMode = "fire";
    let particles = [];
    const particleCount = 65;

    function toggleMenu(forceOpen) {
      const shouldOpen = typeof forceOpen === "boolean" ? forceOpen : !menuDrawer.classList.contains("open");
      menuDrawer.classList.toggle("open", shouldOpen);
      menuBtn.setAttribute("aria-expanded", String(shouldOpen));
    }
    menuBtn.addEventListener("click", (event) => { event.stopPropagation(); toggleMenu(); });
    document.addEventListener("click", (event) => {
      if (!menuDrawer.contains(event.target) && !menuBtn.contains(event.target)) toggleMenu(false);
    });

    function setTheme(mode) {
      if (!themes[mode]) return;
      currentMode = mode;
      const theme = themes[mode];
      root.style.setProperty("--primary-color", theme.primary);
      root.style.setProperty("--primary-glow", theme.glow);
      root.style.setProperty("--border-color", theme.border);
      root.style.setProperty("--bg-gradient", theme.gradient);
      root.style.setProperty("--shadow-color", theme.shadow);

      document.querySelectorAll(".theme-option-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.theme === mode);
      });
      initParticles();
      toggleMenu(false);
    }
    document.querySelectorAll(".theme-option-btn").forEach((button) => {
      button.addEventListener("click", (e) => { e.stopPropagation(); setTheme(button.dataset.theme); });
    });

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }
    window.addEventListener("resize", resizeCanvas);

    class Particle {
      constructor() { this.reset(true); }
      reset(randomY = false) {
        this.x = Math.random() * window.innerWidth;
        this.y = randomY ? Math.random() * window.innerHeight : -12;
        this.size = Math.random() * 3 + 1.5;
        this.opacity = Math.random() * .55 + .3;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - .5) * .05;
        if (currentMode === "fire") {
          this.speedX = (Math.random() - .5) * 1.7;
          this.speedY = (Math.random() - .5) * 1.7;
          this.color = ["#ff0000", "#ff3300", "#ff6600", "#e60000"][Math.floor(Math.random() * 4)];
        } else if (currentMode === "petals") {
          this.speedX = (Math.random() - .5) * 1.1;
          this.speedY = Math.random() * 1.2 + .55;
          this.color = Math.random() > .5 ? "#ff3366" : "#ff7895";
        } else if (currentMode === "snow") {
          this.speedX = (Math.random() - .5) * .8;
          this.speedY = Math.random() * 1.2 + .4;
          this.color = "#ffffff";
        } else {
          this.speedX = (Math.random() - .5) * 1;
          this.speedY = Math.random() * 1.5 + .6;
          this.color = "#00ffff";
        }
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.angle += this.spin;
        if (currentMode === "fire") {
          this.opacity -= .0015;
          if (this.opacity <= .05 || this.x < -10 || this.x > window.innerWidth + 10) this.reset(true);
        } else {
          if (this.y > window.innerHeight + 12) this.reset(false);
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 9;
        ctx.beginPath();
        if (currentMode === "crystal") {
          ctx.moveTo(0, -this.size * 1.5); ctx.lineTo(this.size, 0); ctx.lineTo(0, this.size * 1.5); ctx.lineTo(-this.size, 0); ctx.closePath();
        } else if (currentMode === "petals") {
          ctx.ellipse(0, 0, this.size * .75, this.size * 1.7, 0, 0, Math.PI * 2);
        } else {
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.restore();
      }
    }

    function initParticles() {
      particles = Array.from({ length: particleCount }, () => new Particle());
    }
    function animateParticles() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    resizeCanvas();
    animateParticles();

    // STEP 1: Tap to Enter -> Play Intro Video & Song
    document.getElementById("enterBtn").addEventListener("click", () => {
      introOverlay.style.display = "none";
      introVideoContainer.style.display = "flex";
      menuBtn.style.display = "none";

      introVideo.currentTime = 0;
      introSongAudio.currentTime = 0;
      introVideo.play().catch(e => console.log("Video error", e));
      introSongAudio.play().catch(e => console.log("Audio error", e));
    });

    // STEP 2: When First Intro Video Ends -> Show Dashboard & Play Phonk
    introVideo.addEventListener("ended", () => {
      introSongAudio.pause();
      introVideoContainer.style.display = "none";
      mainContent.style.display = "flex";
      menuBtn.style.display = "flex";
      phonkAudio.play().catch(e => console.log("Phonk play blocked", e));
    });

    // STEP 3: Tap "Let's Start" -> Play Future animation.mp4
    document.getElementById("startAnimBtn").addEventListener("click", () => {
      mainContent.style.display = "none";
      animationContainer.style.display = "flex";
      actionVideo.currentTime = 0;
      actionVideo.play().catch(e => console.log("Animation play error", e));
    });

    // STEP 4: Kill all audio and transition to Prototype Menu (when skipped or ended)
    function finishAnimationSequence() {
      actionVideo.pause();
      phonkAudio.pause();
      phonkAudio.currentTime = 0;
      animationContainer.style.display = "none";
      prototypeMenu.style.display = "flex";
      menuBtn.style.display = "flex";
    }

    actionSkipBtn.addEventListener("click", finishAnimationSequence);
    actionVideo.addEventListener("ended", finishAnimationSequence);

    // Prototype Terminal Logic
    const terminalOutput = document.getElementById("terminalOutput");
    const terminalInput = document.getElementById("terminalInput");
    document.getElementById("terminalSend").addEventListener("click", executeCommand);
    terminalInput.addEventListener("keydown", (e) => { if (e.key === "Enter") executeCommand(); });

    function executeCommand() {
