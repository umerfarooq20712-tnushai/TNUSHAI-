<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASSIFIED</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- INTRO SCREEN STYLES --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000 url('Background.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.5s ease;
        }

        .intro-content {
            text-align: center;
            padding: 20px;
        }

        .intro-title {
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: #ff3333;
            margin-bottom: 30px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .hint-text {
            font-size: 0.9rem;
            color: #aaaaaa;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .unlock-btn {
            background: #1a1a1a;
            border: 2px solid #ff3333;
            color: #fff;
            padding: 14px 28px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s ease;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .unlock-btn:hover {
            background: #ff3333;
            color: #000;
        }

        /* Fullscreen Video Player for Intro */
        #intro-video-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #intro-video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- MAIN WEBSITE STYLES (Hidden until intro finishes) --- */
        #main-content {
            display: none;
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #ff3333;
            text-transform: uppercase;
        }

        .audio-control {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 12px 24px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s ease;
        }

        .audio-control:hover {
            background: #333;
            border-color: #ff3333;
        }

        .easter-egg {
            margin-top: 40px;
            font-size: 0.6rem;
            color: #141414; /* Hidden dark gray */
        }

        .easter-egg:hover {
            color: #444;
        }
    </style>
</head>
<body>

    <!-- INTRO OVERLAY SCREEN -->
    <div id="intro-overlay">
        <div class="intro-content">
            <div class="intro-title">who is MONTAGEM</div>
            <div class="hint-text">you can't find me</div>
            <button class="unlock-btn" onclick="startExperience()">Tap to Enter</button>
        </div>
    </div>

    <!-- INTRO VIDEO CONTAINER -->
    <div id="intro-video-container">
        <video id="introVideo" playsinline>
            <source src="Intro.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- AUDIO FOR INTRO VOICE -->
    <audio id="introAudio">
        <source src="Intro song.mp3" type="audio/mpeg">
    </audio>

    <!-- MAIN WEBSITE CONTENT -->
    <div id="main-content">
        <h1>Find True Identity</h1>
        
        <!-- Background Phonk Music -->
        <audio id="phonkAudio" loop>
            <source src="your-phonk-track.mp3" type="audio/mpeg">
        </audio>

        <button class="audio-control" id="audioBtn" onclick="togglePhonk()">▶ Play Phonk</button>

        <!-- Secret Hint for Closest Friends -->
        <div class="easter-egg">
            If you're reading this, you aren't a stranger. You already know who built this.
        </div>
    </div>

    <script>
        const introOverlay = document.getElementById('intro-overlay');
        const introVideoContainer = document.getElementById('intro-video-container');
        const introVideo = document.getElementById('introVideo');
        const introAudio = document.getElementById('introAudio');
        const mainContent = document.getElementById('main-content');
        const phonkAudio = document.getElementById('phonkAudio');
        const audioBtn = document.getElementById('audioBtn');

        function startExperience() {
            // Hide intro buttons/background screen
            introOverlay.style.display = 'none';
            
            // Show video container
            introVideoContainer.style.display = 'flex';

            // Play intro voice audio and video simultaneously[span_1](start_span)[span_1](end_span)
            introAudio.play().catch(e => console.log("Audio play blocked", e));
            introVideo.play().catch(e => console.log("Video play blocked", e));

            // When intro video ends, hide video and reveal main website
            introVideo.onended = function() {
                introVideoContainer.style.display = 'none';
                mainContent.style.display = 'block';
                
                // Automatically start playing the main phonk track after intro
                phonkAudio.play().catch(e => console.log("Phonk auto-play blocked", e));
                audioBtn.textContent = "⏸ Pause Phonk";
            };
        }

        function togglePhonk() {
            if (phonkAudio.paused) {
                phonkAudio.play();
                audioBtn.textContent = "⏸ Pause Phonk";
            } else {
                phonkAudio.pause();
                audioBtn.textContent = "▶ Play Phonk";
            }
        }
    </script>

</body>
</html>
