<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="CLASSIFIED — WHO AM I. Access restricted.">
<title>CLASSIFIED — WHO AM I</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --primary: #ff1a1a;
  --glow: rgba(255, 0, 0, .45);
  --panel: rgba(8, 8, 8, .88);
  --border: rgba(255, 26, 26, .8);
  --text: #f5f5f5;
  --muted: #b7b7b7;
  --mono: "Share Tech Mono", monospace;
  --display: "Orbitron", sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #080808;
  color: var(--text);
  font-family: var(--mono);
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
}

button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 4px;
}

button:active {
  transform: scale(.97);
}

/* SCREEN TRANSITIONS */

.screen {
  position: fixed;
  inset: 0;
  z-index: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding:
    max(18px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(18px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));

  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transform: scale(1.025);
  transition:
    opacity .45s ease,
    transform .55s cubic-bezier(.2,.7,.2,1),
    visibility 0s linear .55s;
}

.screen.active {
  z-index: 10;
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
  transition:
    opacity .45s ease,
    transform .55s cubic-bezier(.2,.7,.2,1),
    visibility 0s;
}

/* BACKGROUND EFFECTS */

#home {
  background: #000 url("back%20ground.png") center / cover no-repeat;
  isolation: isolate;
}

#home::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(180deg, rgba(0,0,0,.58), rgba(0,0,0,.25), rgba(0,0,0,.8)),
    radial-gradient(ellipse at center, transparent 10%, rgba(0,0,0,.72) 100%);
  pointer-events: none;
}

#particles {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.scanlines {
  position: absolute;
  inset: 0;
  z-index: 80;
  pointer-events: none;
  opacity: .15;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(255, 0, 0, .12) 4px
  );
}

.vignette {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  box-shadow: inset 0 0 100px rgba(0,0,0,.8);
}

/* HOME TERMINAL */

.panel {
  position: relative;
  z-index: 5;
  width: min(410px, 100%);
  padding: 34px 23px 27px;
  text-align: center;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 15px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow:
    0 0 15px rgba(255,0,0,.14),
    0 0 45px var(--glow),
    inset 0 0 25px rgba(255,0,0,.045);
}

.eyebrow {
  margin-bottom: 16px;
  color: #ff7777;
  font-size: .68rem;
  letter-spacing: 3px;
}

.title {
  color: var(--primary);
  font-family: var(--display);
  font-weight: 900;
  text-transform: uppercase;
  font-size: clamp(1.65rem, 8vw, 2.5rem);
  line-height: 1.3;
  letter-spacing: 1px;
  text-shadow: 0 0 12px rgba(255,0,0,.8), 0 0 35px rgba(255,0,0,.35);
}

.subtitle {
  margin: 12px 0 25px;
  color: #ddd;
  font-size: .95rem;
  letter-spacing: 3px;
}

.terminal-line {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 23px;
  color: var(--muted);
  font-size: .76rem;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 10px var(--primary);
}

.action {
  width: 100%;
  padding: 15px 12px;
  border: 1px solid #ff5555;
  border-radius: 7px;
  background: linear-gradient(135deg, #ff2020, #8e0000);
  color: #fff;
  font: 800 .9rem var(--display);
  letter-spacing: 1px;
  box-shadow: 0 0 22px rgba(255,0,0,.3);
  transition: box-shadow .25s, filter .25s;
}

.footer-code {
  margin-top: 21px;
  color: #686868;
  font-size: .66rem;
  letter-spacing: 2px;
}

/* MEDIA SCREENS */

#intro, #future {
  background: #000;
  padding: 0;
}

.media-frame {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.media-shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.2), transparent 25%, transparent 75%, rgba(0,0,0,.3));
}

.media-label {
  position: absolute;
  top: max(20px, env(safe-area-inset-top));
  left: max(18px, env(safe-area-inset-left));
  z-index: 25;
  padding: 9px 12px;
  color: #ff6c6c;
  background: rgba(0,0,0,.72);
  border-left: 2px solid var(--primary);
  font-size: .7rem;
  letter-spacing: 2px;
  pointer-events: none;
}

.timer-badge {
  position: absolute;
  top: max(20px, env(safe-area-inset-top));
  right: max(18px, env(safe-area-inset-right));
  z-index: 25;
  min-width: 95px;
  padding: 10px 13px;
  text-align: center;
  background: rgba(0,0,0,.8);
  border: 1px solid var(--primary);
  border-radius: 5px;
  color: var(--primary);
  font: 800 1rem var(--display);
  box-shadow: 0 0 18px var(--glow);
  pointer-events: none;
}

.timer-badge.urgent {
  color: #fff;
  background: #8c0000;
}

.nav-btn {
  position: absolute;
  left: max(18px, env(safe-area-inset-left));
  bottom: max(22px, env(safe-area-inset-bottom));
  z-index: 30;
  padding: 12px 15px;
  color: #fff;
  border: 1px solid rgba(255,50,50,.85);
  border-radius: 7px;
  background: rgba(5,5,5,.9);
  font: 700 .75rem var(--display);
  letter-spacing: .5px;
  box-shadow: 0 0 15px rgba(255,0,0,.18);
}

.skip {
  position: absolute;
  right: max(18px, env(safe-area-inset-right));
  bottom: max(22px, env(safe-area-inset-bottom));
  z-index: 30;
  padding: 12px 18px;
  border: 1px solid var(--primary);
  background: rgba(0,0,0,.9);
  color: white;
  border-radius: 7px;
  font: 700 .8rem var(--display);
  letter-spacing: 1px;
}

/* CAT SCREEN - FULL IMAGE VISIBLE */

#catScreen {
  background: #000 url("Cat.jpg") center / contain no-repeat;
  isolation: isolate;
  justify-content: flex-end;
  padding-bottom: max(40px, env(safe-area-inset-bottom));
}

.cat-content {
  position: relative;
  z-index: 5;
  width: min(340px, 90vw);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.sad-songs-btn {
  width: 100%;
  padding: 15px 20px;
  background: rgba(0,0,0,0.85);
  border: 2px solid #fff;
  color: #fff;
  font: 800 1rem var(--display);
  letter-spacing: 2px;
  border-radius: 8px;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
  transition: border-color .25s, box-shadow .25s;
}

.sad-songs-btn:hover {
  border-color: var(--primary);
  box-shadow: 0 0 25px var(--glow);
}

/* MUSIC PLAYER - FULL IMAGE VISIBLE */

#musicScreen {
  background: #000 url("Dog.jpg") center / contain no-repeat;
  isolation: isolate;
  justify-content: flex-end;
  padding-bottom: max(30px, env(safe-area-inset-bottom));
}

.music-panel {
  position: relative;
  z-index: 5;
  width: min(340px, 90vw);
  padding: 20px 18px;
  border: 1px solid var(--primary);
  border-radius: 12px;
  background: rgba(8,8,8,0.92);
  box-shadow: 0 0 30px var(--glow);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  text-align: center;
}

.music-title {
  font-family: var(--display);
  color: var(--primary);
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.music-sub {
  color: #ddd;
  font-size: .85rem;
  margin-bottom: 12px;
}

.music-status {
  min-height: 18px;
  color: #ff8b8b;
  font-size: .75rem;
  margin-bottom: 14px;
}

.player-controls {
  display: flex;
  gap: 8px;
  flex-direction: column;
}

.player-btn {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--primary);
  border-radius: 6px;
  background: linear-gradient(135deg, #e71919, #760000);
  color: white;
  font: 700 .75rem var(--display);
  letter-spacing: 1px;
}

.player-btn.secondary {
  background: rgba(0,0,0,.65);
  border-color: #777;
}
</style>
</head>

<body>

<!-- HOME -->
<section class="screen active" id="home" aria-label="Home">
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="vignette"></div>

  <main class="panel">
    <div class="eyebrow">◈ SECURE TERMINAL // 001</div>
    <h1 class="title">WHO AM I</h1>
    <p class="subtitle">you can't find me</p>

    <div class="terminal-line">
      <span class="status-dot"></span>
      <span id="terminalStatus">SYSTEM READY — AWAITING INPUT</span>
    </div>

    <button class="action" id="enter" type="button">
      [ TAP TO ENTER ]
    </button>

    <p class="footer-code">ACCESS LEVEL: CLASSIFIED</p>
  </main>
</section>

<!-- INTRO VIDEO -->
<section class="screen" id="intro" aria-label="Introduction video">
  <div class="media-frame">
    <video id="introVideo" playsinline preload="auto">
      <source src="Intro.mp4" type="video/mp4">
    </video>
    <div class="media-shade"></div>
  </div>

  <div class="media-label">01 // INITIALIZING</div>

  <button class="nav-btn" id="introBack" type="button">
    ← PREVIOUS MENU
  </button>
</section>

<audio id="introSong" preload="auto">
  <source src="Intro%20song.mp3" type="audio/mpeg">
</audio>

<!-- FUTURE ANIMATION -->
<section class="screen" id="future" aria-label="Future animation">
  <div class="media-frame">
    <video id="futureVideo" playsinline preload="auto">
      <source src="Future%20animation.mp4" type="video/mp4">
    </video>
    <div class="media-shade"></div>
  </div>

  <div class="media-label">02 // FUTURE PROTOCOL</div>
  <div class="timer-badge" id="timerBadge" aria-live="off">00:55</div>

  <button class="nav-btn" id="futureBack" type="button">
    ← PREVIOUS MENU
  </button>

  <button class="skip" id="skip" type="button">
    SKIP ↗
  </button>
</section>

<!-- CAT SCREEN -->
<section class="screen" id="catScreen" aria-label="Final message">
  <div class="cat-content">
    <button class="sad-songs-btn" id="sadSongsBtn" type="button">
      sad songs
    </button>
  </div>

  <button class="nav-btn" id="catBack" type="button">
    ← PREVIOUS MENU
  </button>
</section>

<!-- MUSIC PLAYER -->
<section class="screen" id="musicScreen" aria-label="Music player">
  <div class="music-panel">
    <h2 class="music-title">NOW PLAYING</h2>
    <p class="music-sub">Lorha.mp3</p>

    <p class="music-status" id="musicStatus" role="status" aria-live="polite">
      PLAYING AUDIO...
    </p>

    <div class="player-controls">
      <button class="player-btn" id="playPause" type="button">
        ❚❚ PAUSE
      </button>

      <button class="player-btn secondary" id="backToCat" type="button">
        ← PREVIOUS MENU
      </button>
    </div>
  </div>
</section>

<audio id="lorhaSong" loop preload="auto">
  <source src="Lorha.mp3" type="audio/mpeg">
</audio>

<div class="scanlines" aria-hidden="true"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const screens = [...document.querySelectorAll(".screen")];

const introVideo = $("introVideo");
const futureVideo = $("futureVideo");
const introSong = $("introSong");
const lorhaSong = $("lorhaSong");

const timerBadge = $("timerBadge");
const terminalStatus = $("terminalStatus");
const musicStatus = $("musicStatus");
const playPause = $("playPause");

let currentScreen = "home";
let timerInterval = null;
let timeLeft = 55;

function showScreen(id) {
  currentScreen = id;
  screens.forEach(screen => {
    const active = screen.id === id;
    screen.classList.toggle("active", active);
    screen.setAttribute("aria-hidden", String(!active));
    screen.inert = !active;
  });
  if (id === "home") {
    terminalStatus.textContent = "SYSTEM READY — AWAITING INPUT";
  }
}

function pauseAndReset(media) {
  media.pause();
  try {
    media.currentTime = 0;
  } catch (_) {}
}

function stopAllMedia() {
  clearInterval(timerInterval);
  timerInterval = null;
  pauseAndReset(introVideo);
  pauseAndReset(futureVideo);
  pauseAndReset(introSong);
  pauseAndReset(lorhaSong);
}

function navigateTo(id) {
  stopAllMedia();
  showScreen(id);
}

async function playIntro() {
  if (currentScreen !== "intro") return;
  pauseAndReset(introVideo);
  pauseAndReset(introSong);

  let songPromise = introSong.play().catch(() => false);
  try {
    await introVideo.play();
  } catch (error) {
    startFutureAnimation();
    return;
  }
  await songPromise;
}

$("enter").addEventListener("click", async () => {
  stopAllMedia();
  showScreen("intro");
  terminalStatus.textContent = "ACCESS GRANTED — INITIALIZING";
  await playIntro();
});

introVideo.addEventListener("ended", () => {
  if (currentScreen === "intro") {
    startFutureAnimation();
  }
});

introVideo.addEventListener("error", () => {
  if (currentScreen === "intro") {
    startFutureAnimation();
  }
});

$("introBack").addEventListener("click", () => navigateTo("home"));

function updateTimer() {
  const seconds = Math.max(0, timeLeft);
  const minutesText = String(Math.floor(seconds / 60)).padStart(2, "0");
  const secondsText = String(seconds % 60).padStart(2, "0");
  timerBadge.textContent = `${minutesText}:${secondsText}`;
  timerBadge.classList.toggle("urgent", seconds <= 10);
}

function startCountdown() {
  clearInterval(timerInterval);
  timeLeft = 55;
  const startedAt = Date.now();
  updateTimer();

  timerInterval = setInterval(() => {
    if (currentScreen !== "future") {
      clearInterval(timerInterval);
      timerInterval = null;
      return;
    }
    const elapsed = Math.floor((Date.now() - startedAt) / 1000);
    timeLeft = Math.max(0, 55 - elapsed);
    updateTimer();

    if (timeLeft <= 0) {
      showCatScreen();
    }
  }, 250);
}

function startFutureAnimation() {
  if (currentScreen === "future") return;
  stopAllMedia();
  showScreen("future");
  pauseAndReset(futureVideo);

  futureVideo.play().catch(() => {});
  startCountdown();
}

$("futureBack").addEventListener("click", () => {
  stopAllMedia();
  showScreen("intro");
  playIntro();
});

$("skip").addEventListener("click", showCatScreen);

futureVideo.addEventListener("ended", showCatScreen);
futureVideo.addEventListener("error", showCatScreen);

function showCatScreen() {
  stopAllMedia();
  showScreen("catScreen");
}

$("catBack").addEventListener("click", () => {
  stopAllMedia();
  showScreen("future");
  futureVideo.play().catch(() => {});
  startCountdown();
});

$("sadSongsBtn").addEventListener("click", () => {
  stopAllMedia();
  showScreen("musicScreen");
  playLorhaSong();
});

async function playLorhaSong() {
  musicStatus.textContent = "PLAYING AUDIO...";
  lorhaSong.currentTime = 0;
  try {
    await lorhaSong.play();
    playPause.textContent = "❚❚ PAUSE";
  } catch (e) {
    musicStatus.textContent = "TAP PAUSE/PLAY TO START";
  }
}

playPause.addEventListener("click", () => {
  if (lorhaSong.paused) {
    lorhaSong.play();
    playPause.textContent = "❚❚ PAUSE";
    musicStatus.textContent = "PLAYING AUDIO...";
  } else {
    lorhaSong.pause();
    playPause.textContent = "▶ PLAY";
    musicStatus.textContent = "AUDIO PAUSED";
  }
});

$("backToCat").addEventListener("click", showCatScreen);
</script>
</body>
  </html>
