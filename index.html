<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASSIFIED</title>
    <!-- Import Cyberpunk Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff1a1a;
            --primary-glow: rgba(255, 0, 0, 0.8);
            --border-color: rgba(255, 0, 0, 0.7);
            --bg-gradient: linear-gradient(135deg, #ff0000, #990000);
            --box-bg: rgba(10, 10, 10, 0.82);
            --shadow-color: rgba(255, 0, 0, 0.45);
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- TOP LEFT MENU BUTTON --- */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(15, 15, 15, 0.9);
            border: 2px solid var(--primary-color);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            z-index: 10001;
            box-shadow: 0 0 15px var(--shadow-color);
            transition: 0.3s ease;
        }

        .menu-btn span {
            display: block;
            width: 24px;
            height: 3px;
            background-color: var(--primary-color);
            border-radius: 2px;
            transition: 0.3s ease;
        }

        /* Settings Drawer Menu */
        .menu-drawer {
            position: fixed;
            top: 0;
            left: -290px;
            width: 270px;
            height: 100%;
            background: rgba(10, 10, 10, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 2px solid var(--primary-color);
            z-index: 10000;
            transition: left 0.4s ease;
            padding: 85px 20px 20px 20px;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.8);
        }

        .menu-drawer.open {
            left: 0;
        }

        .menu-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        /* 4 Theme Selection Buttons in Drawer */
        .theme-buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .theme-option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ccc;
            padding: 12px 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85srem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-option-btn:hover, .theme-option-btn.active {
            background: var(--primary-color);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* --- INTRO SCREEN OVERLAY --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000 url('back ground.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        /* PARTICLES CANVAS */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: screen;
        }

        /* Styled Glassmorphism Card Box */
        .intro-box {
            position: relative;
            z-index: 2;
            background: var(--box-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 25px;
            text-align: center;
            max-width: 90%;
            width: 380px;
            box-shadow: 0 0 35px var(--shadow-color), inset 0 0 20px rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
        }

        .intro-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--primary-color);
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--primary-glow);
            line-height: 1.2;
            transition: color 0.4s ease;
        }

        .hint-text {
            font-size: 1.2rem;
            color: #dddddd;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* Large Pulsing Cyber Button */
        .unlock-btn {
            background: var(--bg-gradient);
            border: 2px solid var(--primary-color);
            color: #ffffff;
            padding: 18px 36px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 10px;
            text-transform: uppercase;
            width: 100%;
            box-shadow: 0 0 20px var(--shadow-color);
            transition: all 0.3s ease-in-out;
            animation: pulse-glow 2s infinite alternate;
        }

        .unlock-btn:active, .unlock-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 35px var(--primary-glow);
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 15px var(--shadow-color);
            }
            100% {
                box-shadow: 0 0 35px var(--primary-glow);
            }
        }

        /* --- INTRO VIDEO CONTAINER --- */
        #intro-video-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #intro-video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- MAIN WEBSITE CONTENT --- */
        #main-content {
            display: none;
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: var(--primary-color);
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--primary-glow);
            transition: color 0.4s ease;
        }

        .audio-control {
            background: #1a1a1a;
            border: 2px solid var(--primary-color);
            color: #fff;
            padding: 16px 32px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s ease;
            box-shadow: 0 0 15px var(--shadow-color);
        }

        .audio-control:hover {
            background: var(--primary-color);
            color: #000;
        }

        .easter-egg {
            margin-top: 50px;
            font-size: 0.7rem;
            color: #1a1a1a;
            transition: color 0.3s;
        }

        .easter-egg:hover {
            color: #666;
        }
    </style>
</head>
<body>

    <!-- TOP LEFT MENU BUTTON -->
    <div class="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- SETTINGS DRAWER WITH 4 THEME BUTTONS -->
    <div class="menu-drawer" id="menuDrawer">
        <div class="menu-title">Select Vibe</div>
        <div class="theme-buttons-container">
            <button class="theme-option-btn active" id="btn-fire" onclick="setTheme('fire')">🔥 Red Fire</button>
            <button class="theme-option-btn" id="btn-petals" onclick="setTheme('petals')">🌹 Rose Petals</button>
            <button class="theme-option-btn" id="btn-snow" onclick="setTheme('snow')">❄️ Snow Ice</button>
            <button class="theme-option-btn" id="btn-crystal" onclick="setTheme('crystal')">💎 Crystal Ice</button>
        </div>
    </div>

    <!-- INTRO OVERLAY SCREEN -->
    <div id="intro-overlay">
        <!-- CANVAS FOR DYNAMIC PARTICLES -->
        <canvas id="particleCanvas"></canvas>

        <div class="intro-box">
            <div class="intro-title">WHO IS MONTAGEM</div>
            <div class="hint-text">you can't find me</div>
            <button class="unlock-btn" onclick="startExperience()">Tap to Enter</button>
        </div>
    </div>

    <!-- INTRO VIDEO CONTAINER -->
    <div id="intro-video-container">
        <video id="introVideo" playsinline preload="auto">
            <source src="Intro.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- INTRO SONG AUDIO -->
    <audio id="introSongAudio" preload="auto">
        <source src="Intro song.mp3" type="audio/mpeg">
    </audio>

    <!-- MAIN WEBSITE CONTENT -->
    <div id="main-content">
        <h1>Find True Identity</h1>
        
        <!-- Background Phonk Music -->
        <audio id="phonkAudio" loop>
            <source src="your-phonk-track.mp3" type="audio/mpeg">
        </audio>

        <button class="audio-control" id="audioBtn" onclick="togglePhonk()">▶ Play Phonk</button>

        <!-- Secret Hint for Closest Friends -->
        <div class="easter-egg">
            If you're reading this, you aren't a stranger. You already know who built this.
        </div>
    </div>

    <script>
        /* --- MENU DRAWER TOGGLE --- */
        function toggleMenu() {
            const drawer = document.getElementById('menuDrawer');
            drawer.classList.toggle('open');
        }

        /* --- 4-WAY THEME SWITCHER LOGIC --- */
        let currentMode = 'fire'; // Default

        function setTheme(mode) {
            currentMode = mode;
            const root = document.documentElement;

            // Update active states on buttons
            document.querySelectorAll('.theme-option-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + mode).classList.add('active');

            if (mode === 'fire') {
                root.style.setProperty('--primary-color', '#ff1a1a');
                root.style.setProperty('--primary-glow', 'rgba(255, 0, 0, 0.8)');
                root.style.setProperty('--border-color', 'rgba(255, 0, 0, 0.7)');
                root.style.setProperty('--bg-gradient', 'linear-gradient(135deg, #ff0000, #990000)');
                root.style.setProperty('--shadow-color', 'rgba(255, 0, 0, 0.45)');
            } else if (mode === 'petals') {
                root.style.setProperty('--primary-color', '#ff3366');
                root.style.setProperty('--primary-glow', 'rgba(255, 51, 102, 0.8)');
                root.style.setProperty('--border-color', 'rgba(255, 51, 102, 0.7)');
                root.style.setProperty('--bg-gradient', 'linear-gradient(135deg, #ff3366, #990033)');
                root.style.setProperty('--shadow-color', 'rgba(255, 51, 102, 0.45)');
            } else if (mode === 'snow') {
                root.style.setProperty('--primary-color', '#00bfff');
                root.style.setProperty('--primary-glow', 'rgba(0, 191, 255, 0.8)');
                root.style.setProperty('--border-color', 'rgba(0, 191, 255, 0.7)');
                root.style.setProperty('--bg-gradient', 'linear-gradient(135deg, #00bfff, #0044cc)');
                root.style.setProperty('--shadow-color', 'rgba(0, 191, 255, 0.45)');
            } else if (mode === 'crystal') {
                root.style.setProperty('--primary-color', '#00ffff');
                root.style.setProperty('--primary-glow', 'rgba(0, 255, 255, 0.85)');
                root.style.setProperty('--border-color', 'rgba(0, 255, 255, 0.8)');
                root.style.setProperty('--bg-gradient', 'linear-gradient(135deg, #00ffff, #0088aa)');
                root.style.setProperty('--shadow-color', 'rgba(0, 255, 255, 0.5)');
            }

            // Instantly re-initialize particles for the selected mode
            initParticles();
        }

        /* --- ADVANCED MULTI-MODE PARTICLE ENGINE --- */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        const particleCount = 65;

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 4 + 2;
                this.opacity = Math.random() * 0.7 + 0.2;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.05;

                if (currentMode === 'fire') {
                    this.speedX = (Math.random() - 0.5) * 2;
                    this.speedY = (Math.random() - 0.5) * 2;
                    const colors = ['#ff0000', '#ff3300', '#ff6600', '#e60000'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                } else if (currentMode === 'petals') {
                    this.speedX = Math.sin(this.angle) * 1.5;
                    this.speedY = Math.random() * 1.5 + 0.8;
                    this.color = '#ff3366';
                } else if (currentMode === 'snow') {
                    this.speedX = (Math.random() - 0.5) * 1;
                    this.speedY = Math.random() * 1.5 + 0.5;
                    this.color = '#ffffff';
                } else if (currentMode === 'crystal') {
                    this.speedX = (Math.random() - 0.5) * 1.2;
                    this.speedY = Math.random() * 2 + 1;
                    this.color = '#00ffff';
                }
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.angle += this.spin;

                if (currentMode === 'fire') {
                    this.opacity -= 0.002;
                    if (this.opacity <= 0 || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                        this.reset();
                    }
                } else {
                    // Falling items loop back to top
                    if (this.y > canvas.height) {
                        this.y = -10;
                        this.x = Math.random() * canvas.width;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                if (currentMode === 'crystal') {
                    // Draw diamond crystal shape ❄️💎
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size * 1.5);
                    ctx.lineTo(this.size, 0);
                    ctx.lineTo(0, this.size * 1.5);
                    ctx.lineTo(-this.size, 0);
                    ctx.closePath();
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = '#00ffff';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                } else if (currentMode === 'petals') {
                    // Draw oval petal shape 🌹
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size, this.size * 1.8, 0, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = '#ff3366';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                } else {
                    // Standard glowing round particle for Fire & Snow
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8;
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        /* --- INTRO EXPERIENCE CONTROLLER --- */
        const introOverlay = document.getElementById('intro-overlay');
        const introVideoContainer = document.getElementById('intro-video-container');
        const introVideo = document.getElementById('introVideo');
        const introSongAudio = document.getElementById('introSongAudio');
        const mainContent = document.getElementById('main-content');
        const phonkAudio = document.getElementById('phonkAudio');
        const audioBtn = document.getElementById('audioBtn');

        function startExperience() {
            introOverlay.style.display = 'none';
            introVideoContainer.style.display = 'flex';

            introSongAudio.currentTime = 0;
            introVideo.currentTime = 0;

            let playPromiseAudio = introSongAudio.play();
            let playPromiseVideo = introVideo.play();

            if (playPromiseAudio !== undefined) {
                playPromiseAudio.catch(error => console.log("Audio play error:", error));
            }

            if (playPromiseVideo !== undefined) {
                playPromiseVideo.catch(error => console.log("Video play error:", error));
            }

            introVideo.onended = function() {
                introSongAudio.pause();
                introVideoContainer.style.display = 'none';
                mainContent.style.display = 'block';
                
                phonkAudio.play().catch(e => console.log("Phonk auto-play blocked", e));
