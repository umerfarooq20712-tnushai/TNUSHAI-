
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>CLASSIFIED — WHO IS MONTAGEM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --primary:#ff1a1a;
 --glow:rgba(255,0,0,.45);
 --gradient:linear-gradient(135deg,#ff0000,#990000);
 --panel:rgba(8,8,8,.88);
}
html,body{
 width:100%;min-height:100%;background:#080808;color:#fff;
 font-family:"Share Tech Mono",monospace;
}
body{min-height:100vh;min-height:100dvh;overflow:hidden}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:3px}

.screen{
 position:fixed;inset:0;display:none;
 align-items:center;justify-content:center;
 opacity:1;transition:opacity .3s ease;
}
.screen.active{display:flex}
.screen.fade-out{opacity:0;pointer-events:none}

#home{
 background:#000 url("back%20ground.png") center/cover no-repeat;
 z-index:10;padding:20px;
}
#home:before{
 content:"";position:absolute;inset:0;background:rgba(0,0,0,.48);
}
#particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.panel{
 position:relative;z-index:2;width:min(390px,94vw);
 padding:32px 23px;text-align:center;
 background:var(--panel);border:2px solid var(--primary);
 border-radius:16px;backdrop-filter:blur(12px);
 -webkit-backdrop-filter:blur(12px);
 box-shadow:0 0 35px var(--glow);
}
h1,.title{
 color:var(--primary);font-family:Orbitron,sans-serif;
 font-weight:900;text-transform:uppercase;
}
.title{font-size:clamp(1.45rem,6vw,2.15rem);line-height:1.3}
.subtitle{margin:13px 0 26px;color:#ddd;letter-spacing:2px}
.action{
 width:100%;padding:15px 12px;border:2px solid var(--primary);
 border-radius:9px;background:var(--gradient);color:#fff;
 font:700 .95rem Orbitron,sans-serif;
 box-shadow:0 0 18px var(--glow);
 transition:transform .15s,filter .15s;
}
.action:active{transform:scale(.97)}
.action:disabled{opacity:.55;cursor:wait}

#intro,#future{background:#000;z-index:20}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
#dashboard{
 z-index:15;padding:20px;
 background:#080808 url("Incognito.jpg") center/contain no-repeat;
}
#dashboard .panel{width:min(390px,94vw)}
#dashboard h1{font-size:clamp(1.3rem,5vw,1.7rem);margin-bottom:25px}

#future{z-index:30}
.skip{
 position:absolute;right:18px;bottom:max(20px,env(safe-area-inset-bottom));
 z-index:32;padding:12px 18px;border:2px solid var(--primary);
 background:rgba(0,0,0,.9);color:white;border-radius:8px;
 font:700 .85rem Orbitron,sans-serif;
}

#terminal{
 z-index:40;background:#060606;overflow-y:auto;
 padding:25px 16px max(25px,env(safe-area-inset-bottom));
 align-items:flex-start;
}
.terminal-card{
 width:min(600px,100%);margin:auto;
 border:2px solid var(--primary);border-radius:12px;
 padding:22px;background:rgba(10,10,10,.97);
 box-shadow:0 0 30px var(--glow);
}
.terminal-heading{
 color:var(--primary);font:700 1rem Orbitron,sans-serif;
 border-bottom:1px solid var(--primary);
 padding-bottom:13px;margin-bottom:15px;
 overflow-wrap:anywhere;
}
.output{
 color:#00ff66;font-size:.9rem;line-height:1.65;
 overflow-wrap:anywhere;white-space:pre-wrap;
 max-height:45vh;overflow-y:auto;
}
.input-row{display:flex;gap:8px;margin-top:18px}
#command{
 flex:1;min-width:0;padding:12px;background:#000;
 border:1px solid var(--primary);border-radius:6px;color:white;
}
#execute{
 padding:10px 14px;border:0;border-radius:6px;
 background:var(--primary);color:#000;
 font:700 .8rem Orbitron,sans-serif;
}
.menu-button{
 position:fixed;top:max(14px,env(safe-area-inset-top));
 left:14px;z-index:100;width:48px;height:48px;
 display:none;flex-direction:column;align-items:center;
 justify-content:center;gap:5px;background:#101010;
 border:2px solid var(--primary);border-radius:9px;
 box-shadow:0 0 15px var(--glow);
}
.menu-button span{width:23px;height:3px;background:var(--primary);border-radius:2px}
.drawer{
 position:fixed;inset:0 auto 0 0;width:min(280px,85vw);
 z-index:99;background:rgba(8,8,8,.98);
 border-right:2px solid var(--primary);padding:85px 17px 20px;
 transform:translateX(-105%);transition:transform .25s ease;
}
.drawer.open{transform:translateX(0)}
.drawer h2{font:700 1rem Orbitron,sans-serif;color:var(--primary);margin-bottom:22px}
.themes{display:grid;gap:12px}
.theme{
 padding:14px 10px;text-align:left;border-radius:8px;
 border:1px solid #555;background:#171717;color:white;
 font:600 .8rem Orbitron,sans-serif;
}
.theme.selected{background:var(--primary);color:#000;border-color:white}
@media(max-width:420px){
 .panel{padding:25px 16px}
 .terminal-card{padding:17px}
 .terminal-heading{font-size:.85rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<body>

<button class="menu-button" id="menuButton" type="button"
 aria-label="Open theme menu" aria-expanded="false">
 <span></span><span></span><span></span>
</button>

<aside class="drawer" id="drawer" aria-label="Theme menu">
 <h2>SELECT VIBE</h2>
 <div class="themes">
  <button class="theme selected" data-theme="fire">🔥 Red Fire</button>
  <button class="theme" data-theme="petals">🌹 Rose Petals</button>
  <button class="theme" data-theme="snow">❄️ Snow Ice</button>
  <button class="theme" data-theme="crystal">💎 Crystal Ice</button>
 </div>
</aside>

<section class="screen active" id="home">
 <canvas id="particles"></canvas>
 <div class="panel">
  <div class="title">WHO IS MONTAGEM</div>
  <p class="subtitle">you can't find me</p>
  <button class="action" id="enter">TAP TO ENTER</button>
 </div>
</section>

<section class="screen" id="intro">
 <video id="introVideo" playsinline preload="auto">
  <source src="Intro.mp4" type="video/mp4">
 </video>
</section>

<audio id="introSong" preload="auto">
 <source src="Intro%20song.mp3" type="audio/mpeg">
</audio>

<section class="screen" id="dashboard">
 <div class="panel">
  <h1>COMMAND CENTER</h1>
  <button class="action" id="start">▶ LET'S START</button>
 </div>
</section>

<audio id="phonk" loop preload="auto">
 <source src="your-phonk-track.mp3" type="audio/mpeg">
</audio>

<section class="screen" id="future">
 <video id="futureVideo" playsinline preload="auto">
  <source src="Future%20animation.mp4" type="video/mp4">
 </video>
 <button class="skip" id="skip">SKIP ↗</button>
</section>

<section class="screen" id="terminal">
 <div class="terminal-card">
  <div class="terminal-heading">&gt;&gt; SYSTEM ONLINE // TERMINAL ACTIVE</div>
  <div class="output" id="output" aria-live="polite">[SYS] Authentication complete.
[SYS] Welcome to the core dashboard, Architect.
Type 'help' to explore options.</div>
  <form class="input-row" id="commandForm">
   <input id="command" type="text" placeholder="enter command..."
    aria-label="Terminal command" autocomplete="off">
   <button id="execute" type="submit">EXEC</button>
  </form>
 </div>
</section>

<script>
"use strict";

const $ = id => document.getElementById(id);
const screens = ["home","intro","dashboard","future","terminal"].map($);
const introVideo = $("introVideo");
const futureVideo = $("futureVideo");
const introSong = $("introSong");
const phonk = $("phonk");
const menuButton = $("menuButton");
const drawer = $("drawer");

const themes = {
 fire: ["#ff1a1a","rgba(255,0,0,.45)","linear-gradient(135deg,#ff0000,#990000)"],
 petals: ["#ff3366","rgba(255,51,102,.45)","linear-gradient(135deg,#ff3366,#990033)"],
 snow: ["#00bfff","rgba(0,191,255,.45)","linear-gradient(135deg,#00bfff,#0044cc)"],
 crystal: ["#00ffff","rgba(0,255,255,.5)","linear-gradient(135deg,#00ffff,#0088aa)"]
};

let currentTheme = "fire";
let sequence = 0;
let finished = false;
let particleFrame = 0;
let particles = [];
const canvas = $("particles");
const ctx = canvas.getContext("2d");

function showScreen(id) {
 screens.forEach(screen => {
  screen.classList.toggle("active", screen.id === id);
  screen.classList.remove("fade-out");
 });
}

function stopAllAudio() {
 [introSong, phonk, introVideo, futureVideo].forEach(media => {
  media.pause();
  try { media.currentTime = 0; } catch (_) {}
 });
}

function menuVisible(visible) {
 menuButton.style.display = visible ? "flex" : "none";
 if (!visible) closeMenu();
}

function closeMenu() {
 drawer.classList.remove("open");
 menuButton.setAttribute("aria-expanded","false");
 menuButton.setAttribute("aria-label","Open theme menu");
}

menuButton.addEventListener("click", () => {
 const open = !drawer.classList.contains("open");
 drawer.classList.toggle("open",open);
 menuButton.setAttribute("aria-expanded",String(open));
 menuButton.setAttribute("aria-label",open ? "Close theme menu" : "Open theme menu");
});

document.addEventListener("click", event => {
 if (!drawer.contains(event.target) && !menuButton.contains(event.target)) closeMenu();
});

function setTheme(name) {
 if (!themes[name]) return;
 currentTheme = name;
 const [primary,glow,gradient] = themes[name];
 const root = document.documentElement.style;
 root.setProperty("--primary",primary);
 root.setProperty("--glow",glow);
 root.setProperty("--gradient",gradient);

 document.querySelectorAll(".theme").forEach(button => {
  const selected = button.dataset.theme === name;
  button.classList.toggle("selected",selected);
  button.setAttribute("aria-pressed",String(selected));
 });
 particles.forEach(p => p.color = name === "snow" ? "#fff" : primary);
 closeMenu();
}

document.querySelectorAll(".theme").forEach(button => {
 button.addEventListener("click",() => setTheme(button.dataset.theme));
});

function resizeCanvas() {
 const dpr = Math.min(window.devicePixelRatio || 1,2);
 canvas.width = Math.floor(innerWidth*dpr);
 canvas.height = Math.floor(innerHeight*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}

function createParticle() {
 return {
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  r:Math.random()*2.5+1,
  speed:Math.random()*.8+.35,
  color:themes[currentTheme][0]
 };
}

function animateParticles() {
 if (!$("home").classList.contains("active")) {
  particleFrame = 0;
  return;
 }
 ctx.clearRect(0,0,innerWidth,innerHeight);
 for (const p of particles) {
  p.y += p.speed;
  if (p.y > innerHeight+5) {
   p.y = -5;
   p.x = Math.random()*innerWidth;
  }
  ctx.globalAlpha = .65;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha = 1;
 particleFrame = requestAnimationFrame(animateParticles);
}

function startParticles() {
 cancelAnimationFrame(particleFrame);
 resizeCanvas();
 particles = Array.from({length:55},createParticle);
 animateParticles();
}
window.addEventListener("resize",startParticles);
startParticles();

function enterDashboard() {
 sequence++;
 stopAllAudio();
 showScreen("dashboard");
 menuVisible(true);
 phonk.play().catch(() => {});
}

$("enter").addEventListener("click",async () => {
 const token = ++sequence;
 finished = false;
 menuVisible(false);
 closeMenu();
 stopAllAudio();
 showScreen("intro");

 introVideo.currentTime = 0;
 introSong.currentTime = 0;

 // Both play requests happen immediately after the user's tap.
 const songPromise = introSong.play().catch(error => {
  console.warn("Intro song could not play:",error);
 });
 try {
  await introVideo.play();
  await songPromise;
 } catch (error) {
  console.warn("Intro video could not play:",error);
  if (token === sequence) enterDashboard();
 }
});

introVideo.addEventListener("ended",() => {
 if ($("intro").classList.contains("active")) enterDashboard();
});

introVideo.addEventListener("error",() => {
 if ($("intro").classList.contains("active")) enterDashboard();
});

$("start").addEventListener("click",async () => {
 const token = ++sequence;
 finished = false;
 closeMenu();
 menuVisible(false);
 phonk.pause();
 phonk.currentTime = 0;
 showScreen("future");
 futureVideo.currentTime = 0;

 try {
  await futureVideo.play();
 } catch (error) {
  console.warn("Future animation could not play:",error);
  if (token === sequence) finishFuture();
 }
});

function finishFuture() {
 if (finished) return;
 finished = true;
 sequence++;

 // Stop every audio/video source before opening the terminal.
 stopAllAudio();
 showScreen("terminal");
 menuVisible(true);
 closeMenu();
}

$("skip").addEventListener("click",finishFuture);
futureVideo.addEventListener("ended",finishFuture);
futureVideo.addEventListener("error",() => {
 if ($("future").classList.contains("active")) finishFuture();
});

const output = $("output");
const command = $("command");

function addLine(text) {
 output.textContent += "\n" + text;
 output.scrollTop = output.scrollHeight;
}

$("commandForm").addEventListener("submit",event => {
 event.preventDefault();
 const value = command.value.trim().toLowerCase();
 if (!value) return;
 command.value = "";

 if (value === "clear") {
  output.textContent = "[SYS] Terminal cleared.\nType 'help' to explore options.";
  return;
 }

 addLine("> " + value);

 if (value === "help") {
  addLine("Commands: help, status, clear");
 } else if (value === "status") {
  addLine("System online. Theme: " + currentTheme.toUpperCase());
 } else {
  addLine("Unknown command. Type 'help'.");
 }
});

document.addEventListener("visibilitychange",() => {
 if (document.hidden) {
  [introSong,phonk,introVideo,futureVideo].forEach(media => media.pause());
 }
});
</script>
</body>
     </html>
