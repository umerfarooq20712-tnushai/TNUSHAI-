<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>CLASSIFIED — WHO AM I</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --primary:#ff1a1a;
 --glow:rgba(255,0,0,.45);
 --gradient:linear-gradient(135deg,#ff0000,#990000);
 --panel:rgba(8,8,8,.88);
}
html,body{
 width:100%;min-height:100%;background:#080808;color:#fff;
 font-family:"Share Tech Mono",monospace;
}
body{min-height:100vh;min-height:100dvh;overflow:hidden}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.screen{
 position:fixed;inset:0;display:none;
 align-items:center;justify-content:center;
}
.screen.active{display:flex}

#home{
 background:#000 url("back%20ground.png") center/cover no-repeat;
 z-index:10;padding:20px;
}
#home:before{
 content:"";position:absolute;inset:0;background:rgba(0,0,0,.48);
}
#particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.panel{
 position:relative;z-index:2;width:min(390px,94vw);
 padding:32px 23px;text-align:center;
 background:var(--panel);border:2px solid var(--primary);
 border-radius:16px;backdrop-filter:blur(12px);
 -webkit-backdrop-filter:blur(12px);
 box-shadow:0 0 35px var(--glow);
}
.title{
 color:var(--primary);font-family:Orbitron,sans-serif;
 font-weight:900;text-transform:uppercase;font-size:clamp(1.45rem,6vw,2.15rem);line-height:1.3;
}
.subtitle{margin:13px 0 26px;color:#ddd;letter-spacing:2px}
.action{
 width:100%;padding:15px 12px;border:2px solid var(--primary);
 border-radius:9px;background:var(--gradient);color:#fff;
 font:700 .95rem Orbitron,sans-serif;
 box-shadow:0 0 18px var(--glow);
}

#intro,#future{background:#000;z-index:20}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}

#future{z-index:30}
.timer-badge{
 position:absolute;top:20px;right:20px;z-index:35;
 background:rgba(0,0,0,0.8);border:2px solid var(--primary);
 color:var(--primary);padding:8px 14px;border-radius:6px;
 font:700 1rem Orbitron,sans-serif;box-shadow:0 0 15px var(--glow);
}
.skip{
 position:absolute;right:18px;bottom:max(20px,env(safe-area-inset-bottom));
 z-index:32;padding:12px 18px;border:2px solid var(--primary);
 background:rgba(0,0,0,.9);color:white;border-radius:8px;
 font:700 .85rem Orbitron,sans-serif;
}

/* Cat.jpg Screen */
#catScreen{
 background:#000 url("Cat.jpg") center/cover no-repeat;
 z-index:40;flex-direction:column;justify-content:center;align-items:center;
 padding:30px 20px;text-align:center;
}
#catScreen::before{
 content:"";position:absolute;inset:0;background:rgba(0,0,0,0.5);z-index:1;
}
.cat-content{
 position:relative;z-index:2;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:25px;
}
.cat-msg1{
 font-family:Orbitron,sans-serif;font-weight:700;font-size:clamp(1.05rem,4vw,1.3rem);
 color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.9);line-height:1.4;
}
.cat-msg2-box{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.cat-msg2{
 font-size:1rem;color:#ffdede;text-shadow:0 2px 6px rgba(0,0,0,0.9);
}
.arrows{font-size:1.2rem;color:var(--primary);letter-spacing:4px;font-weight:bold}
.sad-songs-btn{
 width:100%;padding:14px 20px;background:#000;border:2px solid #fff;color:#fff;
 font:700 1.1rem Orbitron,sans-serif;border-radius:8px;
 box-shadow:0 0 20px rgba(255,255,255,0.4);transition:0.2s;
}
.sad-songs-btn:active{transform:scale(0.95)}

/* Dog.jpg & Lorha.mp3 Player Screen */
#musicScreen{
 background:#000 url("Dog.jpg") center/cover no-repeat;
 z-index:50;flex-direction:column;justify-content:center;align-items:center;
 padding:20px;text-align:center;
}
#musicScreen::before{
 content:"";position:absolute;inset:0;background:rgba(0,0,0,0.6);z-index:1;
}
.music-panel{
 position:relative;z-index:2;background:rgba(15,15,15,0.9);
 border:2px solid var(--primary);padding:30px;border-radius:16px;
 width:min(350px,90vw);box-shadow:0 0 35px var(--glow);
}
.music-title{font-family:Orbitron,sans-serif;color:var(--primary);font-size:1.3rem;margin-bottom:15px}
.music-sub{color:#ddd;font-size:0.95rem;margin-bottom:25px}
.back-btn{
 padding:10px 20px;background:var(--gradient);border:1px solid var(--primary);
 color:#fff;border-radius:6px;font:700 0.9rem Orbitron,sans-serif;
}
</style>
</head>

<body>

<!-- 1. HOME SCREEN -->
<section class="screen active" id="home">
 <canvas id="particles"></canvas>
 <div class="panel">
  <div class="title">WHO AM I</div>
  <p class="subtitle">you can't find me</p>
  <button class="action" id="enter">TAP TO ENTER</button>
 </div>
</section>

<!-- 2. INTRO VIDEO -->
<section class="screen" id="intro">
 <video id="introVideo" playsinline preload="auto">
  <source src="Intro.mp4" type="video/mp4">
 </video>
</section>

<audio id="introSong" preload="auto">
 <source src="Intro%20song.mp3" type="audio/mpeg">
</audio>

<!-- 3. FUTURE ANIMATION WITH TIMER -->
<section class="screen" id="future">
 <div class="timer-badge" id="timerBadge">00:55</div>
 <video id="futureVideo" playsinline preload="auto">
  <source src="Future%20animation.mp4" type="video/mp4">
 </video>
 <button class="skip" id="skip">SKIP ↗</button>
</section>

<!-- 4. CAT.JPG SCREEN -->
<section class="screen" id="catScreen">
 <div class="cat-content">
  <div class="cat-msg1">brother you can't know who am I you wasted your time 😊</div>
  <div class="cat-msg2-box">
   <div class="cat-msg2">don't be sad you can listen to songs</div>
   <div class="arrows">↓↓↓↓↓</div>
   <button class="sad-songs-btn" id="sadSongsBtn">sad songs</button>
  </div>
 </div>
</section>

<!-- 5. DOG.JPG & LORHA.MP3 PLAYER SCREEN -->
<section class="screen" id="musicScreen">
 <div class="music-panel">
  <div class="music-title">NOW PLAYING</div>
  <div class="music-sub">Lorha.mp3</div>
  <button class="back-btn" id="backToCat">BACK</button>
 </div>
</section>

<audio id="lorhaSong" loop preload="auto">
 <source src="Lorha.mp3" type="audio/mpeg">
</audio>

<script>
"use strict
