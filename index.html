<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASSIFIED</title>
    <!-- Import Cyberpunk Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- INTRO SCREEN OVERLAY --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000 url('back ground.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        /* FIRE PARTICLES CANVAS */
        #fireCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: screen; /* Blends fire particles smoothly with dark wallpaper */
        }

        /* Styled Glassmorphism Card Box */
        .intro-box {
            position: relative;
            z-index: 2;
            background: rgba(10, 10, 10, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 0, 0, 0.7);
            border-radius: 16px;
            padding: 40px 25px;
            text-align: center;
            max-width: 90%;
            width: 380px;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.45), inset 0 0 20px rgba(255, 0, 0, 0.25);
        }

        .intro-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ff1a1a;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.9), 0 0 30px rgba(255, 0, 0, 0.5);
            line-height: 1.2;
        }

        .hint-text {
            font-size: 1.2rem;
            color: #dddddd;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* Large Pulsing Cyber Button */
        .unlock-btn {
            background: linear-gradient(135deg, #ff0000, #990000);
            border: 2px solid #ff4d4d;
            color: #ffffff;
            padding: 18px 36px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 10px;
            text-transform: uppercase;
            width: 100%;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            transition: all 0.2s ease-in-out;
            animation: pulse-glow 2s infinite alternate;
        }

        .unlock-btn:active, .unlock-btn:hover {
            transform: scale(1.04);
            background: linear-gradient(135deg, #ff3333, #cc0000);
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.95);
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            }
            100% {
                box-shadow: 0 0 35px rgba(255, 0, 0, 0.95);
            }
        }

        /* --- INTRO VIDEO CONTAINER --- */
        #intro-video-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #intro-video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- MAIN WEBSITE CONTENT --- */
        #main-content {
            display: none;
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #ff1a1a;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }

        .audio-control {
            background: #1a1a1a;
            border: 2px solid #ff3333;
            color: #fff;
            padding: 16px 32px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s ease;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .audio-control:hover {
            background: #ff3333;
            color: #000;
        }

        .easter-egg {
            margin-top: 50px;
            font-size: 0.7rem;
            color: #1a1a1a;
            transition: color 0.3s;
        }

        .easter-egg:hover {
            color: #666;
        }
    </style>
</head>
<body>

    <!-- INTRO OVERLAY SCREEN -->
    <div id="intro-overlay">
        <!-- CANVAS FOR RED FIRE EMBERS -->
        <canvas id="fireCanvas"></canvas>

        <div class="intro-box">
            <div class="intro-title">WHO IS MONTAGEM</div>
            <div class="hint-text">you can't find me</div>
            <button class="unlock-btn" onclick="startExperience()">Tap to Enter</button>
        </div>
    </div>

    <!-- INTRO VIDEO CONTAINER -->
    <div id="intro-video-container">
        <video id="introVideo" playsinline preload="auto">
            <source src="Intro.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- INTRO SONG AUDIO -->
    <audio id="introSongAudio" preload="auto">
        <source src="Intro song.mp3" type="audio/mpeg">
    </audio>

    <!-- MAIN WEBSITE CONTENT -->
    <div id="main-content">
        <h1>Find True Identity</h1>
        
        <!-- Background Phonk Music -->
        <audio id="phonkAudio" loop>
            <source src="your-phonk-track.mp3" type="audio/mpeg">
        </audio>

        <button class="audio-control" id="audioBtn" onclick="togglePhonk()">▶ Play Phonk</button>

        <!-- Secret Hint for Closest Friends -->
        <div class="easter-egg">
            If you're reading this, you aren't a stranger. You already know who built this.
        </div>
    </div>

    <script>
        /* --- FIRE ANIMATION ENGINE (Unrestricted HTML5 Canvas) --- */
        const canvas = document.getElementById('fireCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = 60; // Density of flame embers

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 20;
                this.size = Math.random() * 4 + 1.5;
                this.speedY = Math.random() * 2.5 + 0.8;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.opacity = Math.random() * 0.8 + 0.2;
                // Intense fire red-orange color palette
                const colors = ['#ff0000', '#ff3300', '#ff6600', '#e60000', '#cc0000'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.opacity -= 0.004;

                if (this.y < -10 || this.opacity <= 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateFire() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateFire);
        }
        animateFire();

        /* --- INTRO EXPERIENCE CONTROLLER --- */
        const introOverlay = document.getElementById('intro-overlay');
        const introVideoContainer = document.getElementById('intro-video-container');
        const introVideo = document.getElementById('introVideo');
        const introSongAudio = document.getElementById('introSongAudio');
        const mainContent = document.getElementById('main-content');
        const phonkAudio = document.getElementById('phonkAudio');
        const audioBtn = document.getElementById('audioBtn');

        function startExperience() {
            introOverlay.style.display = 'none';
            introVideoContainer.style.display = 'flex';

            introSongAudio.currentTime = 0;
            introVideo.currentTime = 0;

            let playPromiseAudio = introSongAudio.play();
            let playPromiseVideo = introVideo.play();

            if (playPromiseAudio !== undefined) {
                playPromiseAudio.catch(error => console.log("Audio play error:", error));
            }

            if (playPromiseVideo !== undefined) {
                playPromiseVideo.catch(error => console.log("Video play error:", error));
            }

            introVideo.onended = function() {
                introSongAudio.pause();
                introVideoContainer.style.display = 'none';
                mainContent.style.display = 'block';
                
                phonkAudio.play().catch(e => console.log("Phonk auto-play blocked", e));
                audioBtn.textContent = "⏸ Pause Phonk";
            };
        }

        function togglePhonk() {
            if (phonkAudio.paused) {
                phonkAudio.play();
                audioBtn.textContent = "⏸ Pause Phonk";
            } else {
                phonkAudio.pause();
                audioBtn.textContent = "▶ Play Phonk";
            }
        }
    </script>

</body>
</html>
